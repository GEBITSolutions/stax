# Reference consumer shape for the base-image Hetzner golden image:
# packer/base-image, cax11 (arm64), Ubuntu 24.04. The template owns the
# source block; this stack tells STAX where to publish the snapshot.
stacks:
  - id: golden-hetzner
    type: packer
    packer_directory: packer/base-image
    packer_template: .
    packer_version: "1.16.1"
    build_target: hetzner
    hetzner:
      location: fsn1
      server_type: cax11
      snapshot_name: base-image-golden
      snapshot_labels:
        base-image: "true"
        role: golden
      keep_last: 3
    output-var: [image_id, image_ref, build_target, version, labels]

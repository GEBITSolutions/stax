---
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # actionlint <= 1.7.12 has stale metadata for
      # actions/create-github-app-token@v3: it still requires the
      # deprecated app-id input and does not know client-id.
      - 'missing input "app-id" .*create-github-app-token@v3'
      - 'input "client-id" is not defined .*create-github-app-token@v3'

name: CLI

# Pull requests only: on main, release.yml's cli-pack job typechecks, tests and builds the CLI.
on:
  pull_request:
    paths:
      - cli/**
      - schema/**
      - configs/**
      - .github/actions/gh-resolve-credentials/**
      - .github/actions/gh-convert-stack-inputs/**
      - .github/actions/terraform_action/v2.0/action.yaml
      - .github/workflows/a-wf-deploy-stack-terraform.yml
      - .github/workflows/a-wf-setup-ci.yml
      - .github/scripts/validate-environment.mjs
      - .github/scripts/validate-environment.test.mjs
      - examples/packer/**
      - .github/scripts/packer-build-target.mjs
      - .github/scripts/packer-build-target.test.mjs
      - .github/scripts/packer-hcloud-token.mjs
      - .github/scripts/packer-hcloud-token.test.mjs
      - .github/workflows/a-wf-deploy-stack-packer.yml
      - .github/workflows/cli.yml
      - .github/workflows/cli-pack.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Test workflow script contracts
        run: node --test ../.github/scripts/*.test.mjs
        working-directory: cli
      - run: npm run build
      - name: Smoke packed CLI global and project-local installs
        env:
          FRAMEWORK_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          target="$(mktemp -d)"
          trap 'rm -rf "$target"' EXIT
          npm pack --pack-destination "$target"
          node scripts/smoke-package.mjs "$target"/gebit-stax-cli-*.tgz "$FRAMEWORK_REF"
      - name: Validate this repository's deploy configs
        run: node dist/cli.js validate config ../configs -r --strict

  credentials:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/actions/gh-resolve-credentials
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/actions/gh-resolve-credentials/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run format:check
      - run: npm run lint
      - run: npm run package

name: CLI

on:
  pull_request:
    paths:
      - cli/**
      - schema/**
      - configs/**
      - .github/workflows/cli.yml
  push:
    branches: [main]
    paths:
      - cli/**
      - schema/**
      - configs/**
      - .github/workflows/cli.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke stax init, add and validate
        run: |
          target="$(mktemp -d)"
          node dist/cli.js init "$target"
          test -f "$target/.github/workflows/deploy.yml"
          node dist/cli.js add "$target" --name "Network Hub" --type opentofu --yes
          node dist/cli.js add "$target" --name Docs --type github-pages-site-deploy --yes
          node dist/cli.js validate config "$target/configs/default.yaml" --strict
      - name: Validate this repository's deploy configs
        run: node dist/cli.js validate config ../configs -r --strict

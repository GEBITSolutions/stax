---
# Always forward secrets by name on every hop. Never use secrets: inherit —
# inherit breaks for callers from other orgs, and mixed inherit/explicit chains
# are hard to reason about. Cross-org callers map this workflow_call.secrets
# list by name into deploy-levels; levels and stack remaps the same names into
# nested stack-type workflows. Leaf jobs that consume Environment-scoped values
# must set environment: (packer/terraform/script/sites already do).
# Tradeoff: only declared names reach toJson(secrets); arbitrary custom
# gh.secret.* / stack.*.secret.* names need an added workflow_call declaration.
name: ".Deploy Levels (Abstract)"
on:
  workflow_call:
    inputs:
      ci_config:
        required: true
        type: string
      env:
        required: true
        type: string
      default_location:
        required: false
        default: "northeurope"
        type: string
      external_repos:
        required: false
        default: "[]"
        type: string
      actions-version:
        required: false
        default: "1.7.1"
        description: "Github Repo branch for shared actions."
        type: string
      actions-repository:
        required: false
        default: "GEBITSolutions/stax"
        type: string
    secrets:
      ARM_CLIENT_ID:
        required: false
      ARM_CLIENT_SECRET:
        required: false
      ARM_SUBSCRIPTION_ID:
        required: false
      ARM_TENANT_ID:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_ROLE_ARN:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false
      CI_AZURE_STATIC_WEB_APPS_API_TOKEN:
        required: false
      CI_ENV_TRANSFER_GH_TOKEN:
        required: false
      CI_GITHUB_PAT:
        required: false
      CI_GITHUB_TOKEN_TERRAFORM:
        required: false
      GPG_PASSPHRASE:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      GPG_PUBLIC_KEY:
        required: false
      HCLOUD_TOKEN:
        required: false
      INFRACOST_API_KEY:
        required: false
      PULP_HOSTNAME:
        required: false
      PULP_PASSWORD:
        required: false
      PULP_USERNAME:
        required: false
      RELEASE_APP_CLIENT_SECRET:
        required: false
      RELEASE_GH_APP_PRIVATE_KEY:
        required: false
      REPO_KEYSTORE_SP_CLIENT_SECRET:
        required: false
      TF_PROVIDER_GH_OWNER:
        required: false

jobs:
  l0:
    uses: ./.github/workflows/a-wf-deploy-stack.yml
    name: ${{ join(fromJson(inputs.ci_config)[0].*.name,',') || 'No Jobs' }}
    strategy:
      fail-fast: false
      matrix:
        data: ${{ fromJson(inputs.ci_config)[0] }}
    with:
      default-location: ${{ inputs.default_location }}
      env: ${{ inputs.env }}
      data: "${{ toJson(matrix.data) }}"
      external-repos: "${{ inputs.external_repos }}"
      actions-version: ${{ inputs.actions-version }}
      actions-repository: ${{ inputs.actions-repository }}
    secrets:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      CI_AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.CI_AZURE_STATIC_WEB_APPS_API_TOKEN }}
      CI_ENV_TRANSFER_GH_TOKEN: ${{ secrets.CI_ENV_TRANSFER_GH_TOKEN }}
      CI_GITHUB_PAT: ${{ secrets.CI_GITHUB_PAT }}
      CI_GITHUB_TOKEN_TERRAFORM: ${{ secrets.CI_GITHUB_TOKEN_TERRAFORM }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      PULP_HOSTNAME: ${{ secrets.PULP_HOSTNAME }}
      PULP_PASSWORD: ${{ secrets.PULP_PASSWORD }}
      PULP_USERNAME: ${{ secrets.PULP_USERNAME }}
      RELEASE_APP_CLIENT_SECRET: ${{ secrets.RELEASE_APP_CLIENT_SECRET }}
      RELEASE_GH_APP_PRIVATE_KEY: ${{ secrets.RELEASE_GH_APP_PRIVATE_KEY }}
      REPO_KEYSTORE_SP_CLIENT_SECRET: ${{ secrets.REPO_KEYSTORE_SP_CLIENT_SECRET }}
      TF_PROVIDER_GH_OWNER: ${{ secrets.TF_PROVIDER_GH_OWNER }}

  l1:

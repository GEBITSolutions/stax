---
name: ". Abstract Release Workflow"
run-name: "Release for Commit: ${{ github.sha }}"

# Standard release: the a-wf-release-* phase workflows in their usual order. Repositories
# that need steps between phases (for example building release assets once the version is
# known) call the phases directly instead; see release.yml in this repository.

on:
  workflow_call:
    inputs:
      fix-actions-and-workflow-versions:
        description: "If set to 'true', the action will update the versions of actions and workflows in the repository to\
          \ match the new release version."
        required: false
        type: string
        default: "false"
      shared-code-workflow-files-to-pin:
        description: >-
          JSON array of caller .github/workflows files whose stax reusable-workflow refs are pinned to
          the latest published shared-code-lib release.
        required: false
        type: string
        default: "[]"
      e2e-workflow-dispatch-list:
        description: "JSON array of workflow filenames to dispatch for E2E checks."
        required: false
        type: string
        default: "[]"
      deploy-mkdocs:
        description: "If set to 'true', deploy versioned MkDocs documentation to GitHub Pages using mike after the pre-release\
          \ is created."
        required: false
        type: string
        default: "false"
    outputs:
      has-next-version:
        description: "'true' when commits since the last release produced a new version."
        value: ${{ jobs.version.outputs.has-next-version }}
      version:
        description: "The new version; also the Git tag of the release."
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

jobs:
  version:
    uses: ./.github/workflows/a-wf-release-version.yml
    secrets: inherit

  prepare:
    needs: version
    if: ${{ needs.version.outputs.has-next-version == 'true' }}
    uses: ./.github/workflows/a-wf-release-prepare.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
    with:
      version: ${{ needs.version.outputs.version }}
      fix-actions-and-workflow-versions: ${{ inputs.fix-actions-and-workflow-versions }}
      shared-code-workflow-files-to-pin: ${{ inputs.shared-code-workflow-files-to-pin }}

  e2e:
    needs: [version, prepare]
    if: ${{ inputs.e2e-workflow-dispatch-list != '[]' }}
    uses: ./.github/workflows/a-wf-release-e2e.yml
    permissions:
      actions: write
    with:
      version: ${{ needs.version.outputs.version }}
      workflows: ${{ inputs.e2e-workflow-dispatch-list }}

  docs-pre-release:
    needs: [version, prepare]
    if: ${{ inputs.deploy-mkdocs == 'true' }}
    uses: ./.github/workflows/a-wf-release-docs.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      prev-version: ${{ needs.version.outputs.prev-version }}
      release-status: pre-release

  approve:
    needs: prepare
    uses: ./.github/workflows/a-wf-release-approve.yml

  publish:
    needs: [version, approve]
    uses: ./.github/workflows/a-wf-release-publish.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}

  docs-stable:
    needs: [version, publish, docs-pre-release]
    if: ${{ inputs.deploy-mkdocs == 'true' }}
    uses: ./.github/workflows/a-wf-release-docs.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      release-status: stable

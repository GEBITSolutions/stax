name: CLI release

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  publish:
    # npm trusted publishing accepts GitHub-hosted runners only.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no caches in release builds
      - name: Check that the tag matches the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "cli-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected cli-v$version)"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish

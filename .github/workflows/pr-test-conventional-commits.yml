name: PR conventional commits check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Test Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR commit subjects
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/,-]+\))?!?: .+'
          bad=0
          while IFS= read -r subject; do
            if [[ "$subject" =~ $pattern ]] || [[ "$subject" =~ ^Merge\  ]] || [[ "$subject" =~ ^Revert\  ]]; then
              echo "OK   $subject"
            else
              echo "::error::Not a conventional commit subject: $subject"
              bad=1
            fi
          done < <(git log --no-merges --format=%s "origin/${BASE_REF}..HEAD")
          exit "$bad"

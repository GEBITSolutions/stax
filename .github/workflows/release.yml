---
name: "\U0001F4E6 Release"

# Releases the workflows, the CLI and the documentation site under one version. Composes
# the a-wf-release-* phases directly: the CLI is packed once the version is known and
# attached to the pre-release; after the release approval the documentation site is
# deployed, and only once that succeeded are the release and the CLI published.

on:
  workflow_dispatch:
  push:
    branches:
    - main

permissions:
  contents: read

jobs:
  version:
    name: "Version"
    uses: ./.github/workflows/a-wf-release-version.yml
    secrets: inherit

  cli-pack:
    name: "Pack CLI"
    needs: version
    if: ${{ needs.version.outputs.has-next-version == 'true' }}
    uses: ./.github/workflows/cli-pack.yml
    with:
      version: ${{ needs.version.outputs.version }}

  prepare:
    name: "Pre-release"
    needs: [version, cli-pack]
    uses: ./.github/workflows/a-wf-release-prepare.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
    with:
      version: ${{ needs.version.outputs.version }}
      fix-actions-and-workflow-versions: ${{ 'true' }}
      assets-artifact: stax-cli

  approve:
    name: "Approve"
    needs: prepare
    uses: ./.github/workflows/a-wf-release-approve.yml

  docs:
    name: "Documentation"
    needs: [version, prepare, approve]
    uses: ./.github/workflows/docs.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
      packages: write
      pages: write
      id-token: write
    with:
      release-version: ${{ needs.version.outputs.version }}
      source-ref: ${{ needs.prepare.outputs.release-commit }}

  publish:
    name: "Publish"
    needs: [version, docs]
    uses: ./.github/workflows/a-wf-release-publish.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}

  cli-publish:
    name: "Publish CLI to npm"
    needs: [version, publish]
    uses: ./.github/workflows/cli-publish.yml
    permissions:
      contents: read
      id-token: write # npm trusted publishing checks this workflow file (release.yml)
    with:
      version: ${{ needs.version.outputs.version }}

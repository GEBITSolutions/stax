---
# yamllint disable rule:line-length
name: "Static Site Build"
description: "Builds MkDocs or Zensical sites from source_repo/, or verifies a prebuilt site."
inputs:
  source-type:
    description: "Site source type: mkdocs, zensical, or prebuilt."
    required: false
    default: "mkdocs"
  docs-path:
    description: "Relative project path inside source_repo/."
    required: false
    default: "docs"
  app-location:
    description: "Optional output directory relative to source_repo/. Defaults to <docs-path>/site/."
    required: false
    default: ""
  site-url:
    description: "Optional canonical site URL overriding the project configuration during the build."
    required: false
    default: ""
  docs-version:
    description: "Optional safe version identifier for Zensical archive builds."
    required: false
    default: ""
  publish-version:
    description: "Push the versioned archive to origin only when true."
    required: false
    default: "false"
outputs:
  site-dir:
    description: "Built site directory, prefixed with source_repo/."
    value: ${{ steps.site-dir.outputs.site-dir }}
runs:
  using: composite
  steps:
  - name: Install Python
    uses: actions/setup-python@v7
    with:
      python-version: '3.12'

  - name: Install uv
    uses: astral-sh/setup-uv@v10.1.0
    if: ${{ inputs.source-type == 'mkdocs' || inputs.source-type == 'zensical' }}

  - name: Build or resolve site
    id: site-dir
    shell: bash
    env:
      SOURCE_TYPE: ${{ inputs.source-type }}
      DOCS_RELATIVE_PATH: ${{ inputs.docs-path }}
      APP_LOCATION: ${{ inputs.app-location }}
      INPUT_SITE_URL: ${{ inputs.site-url }}
      DOCS_VERSION: ${{ inputs.docs-version }}
      PUBLISH_VERSION: ${{ inputs.publish-version }}
    run: python3 "$GITHUB_ACTION_PATH/build_site.py"

---
name: Terraform Variable Converter
description: >
  Converts environment variables and secrets into Terraform-compatible key-value
  pairs.
author: Fractiunate.me
branding:
  icon: settings
  color: blue

inputs:
  variables:
    description: 'JSON object containing environment variables to be converted.'
    required: false
    default: '{}'
  secrets:
    description: 'JSON object containing secrets to be converted.'
    required: false
    default: '{}'
  excluded-secrets:
    description: >
      JSON array of secret names to remove before resolving input references.
    required: false
    default: '[]'
  convertInputs:
    description: 'JSON list of inputs to be converted.'
    required: false
    default: '[]'
  additionalInputs:
    description: 'JSON object of additional key-value pairs to include.'
    required: false
    default: '{}'
  config-globals:
    description: >
      JSON object of config globals from deploy-config.yaml globals section.
      Referenced via global.config.var.<key> or legacy globals.<key> syntax.
    required: false
    default: '{}'
  pipeline-globals:
    description: >
      JSON object of pipeline globals (CI env vars like customer_id, stage).
      Referenced via global.pipeline.var.<key> syntax.
    required: false
    default: '{}'
  basePath:
    description: 'Base path to look for external Configs.'
    required: false
  allowNull:
    description: 'Allow Null or not found variables and secrets'
    required: false
    default: 'false'
  secret-backend:
    description: 'Backend for secret_backend.secret.<key> references (gh or vault).'
    required: false
    default: 'gh'
  environment-name:
    description: 'Name of the github environment'
    required: false
  key-vault-url:
    description: 'URL of the Azure Key Vault to read secrets and variables from'
    required: false
  key-vault-sp-client-id:
    description: 'Service Principal Client ID with access to the Key Vault'
    required: false
  key-vault-sp-client-secret:
    description: 'Service Principal Client Secret with access to the Key Vault'
    required: false
  key-vault-sp-tenant-id:
    description: 'Service Principal Tenant ID with access to the Key Vault'
    required: false
  oidc-enabled:
    description: 'Enable OIDC federated token auth for Key Vault'
    required: false
    default: 'false'
  ssm-parameter-prefix:
    description: >
      Path prefix of the AWS SSM Parameter Store to read secrets and variables
      from (e.g. /example/cicd). A non-empty value selects the SSM keystore and is
      mutually exclusive with key-vault-url.
    required: false
  aws-region:
    description: 'AWS region hosting the SSM Parameter Store. Required when ssm-parameter-prefix is set.'
    required: false
  aws-role-arn:
    description: >
      IAM role ARN assumed via GitHub OIDC to access the SSM Parameter Store.
      Requires the job to grant id-token write permission.
    required: false
  aws-access-key-id:
    description: 'Static AWS access key id with access to the SSM Parameter Store. Omit when using aws-role-arn.'
    required: false
  aws-secret-access-key:
    description: 'Static AWS secret access key with access to the SSM Parameter Store. Omit when using aws-role-arn.'
    required: false
  aws-session-token:
    description: 'Optional AWS session token for temporary static credentials.'
    required: false

outputs:
  tf-vars-map:
    description: 'JSON array of key-value pairs formatted for Terraform.'

runs:
  using: node24
  main: dist/index.js

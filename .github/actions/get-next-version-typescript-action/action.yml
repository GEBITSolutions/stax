---
name: 'get-next-version'
description: 'Gets the next version for your repository according to semantic versioning based on conventional commits.'
inputs:
  prefix:
    description: 'Sets the version prefix'
    required: false
    default: ''
  feature_prefixes:
    description: 'Sets custom feature prefixes (comma-separated)'
    required: false
    default: ''
  fix_prefixes:
    description: 'Sets custom fix prefixes (comma-separated)'
    required: false
    default: ''
  chore_prefixes:
    description: 'Sets custom chore prefixes (comma-separated)'
    required: false
    default: ''
  log_order:
    description: 'Sets git log order (committer-time|topological)'
    required: false
    default: 'committer-time'
outputs:
  version:
    description: 'Next version'
  hasNextVersion:
    description: 'Whether there is a next version'
  prevVersion:
    description: 'Highest reachable release version tag, empty if none'
runs:
  using: 'node24'
  main: 'dist/index.js'
